# systemd drop-in override for digital-twin-api.service (v4.0.0 hardening).
#
# Installed to: /etc/systemd/system/digital-twin-api.service.d/override.conf
# This merges with the base unit WITHOUT touching its Environment= secret line.
#
#   sudo mkdir -p /etc/systemd/system/digital-twin-api.service.d
#   sudo cp deploy/api.override.conf /etc/systemd/system/digital-twin-api.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart digital-twin-api
[Service]
Restart=on-failure
RestartSec=5s
Environment="GCP_ZONE=asia-south1-a"
StandardOutput=append:/home/nsdeshmukh306/digital-twin/logs/api.log
StandardError=append:/home/nsdeshmukh306/digital-twin/logs/api_error.log
