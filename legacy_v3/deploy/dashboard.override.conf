# systemd drop-in override for digital-twin-dashboard.service (v4.0.0 hardening).
#
# Installed to: /etc/systemd/system/digital-twin-dashboard.service.d/override.conf
#
#   sudo mkdir -p /etc/systemd/system/digital-twin-dashboard.service.d
#   sudo cp deploy/dashboard.override.conf /etc/systemd/system/digital-twin-dashboard.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart digital-twin-dashboard
[Service]
Restart=on-failure
RestartSec=5s
StandardOutput=append:/home/nsdeshmukh306/digital-twin/logs/dashboard.log
StandardError=append:/home/nsdeshmukh306/digital-twin/logs/dashboard_error.log
